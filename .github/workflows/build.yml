# Builds Rift Solo for Android, Windows, Linux and macOS on every push, and publishes a release for v* tags.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (shared code + app)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/RiftSolo-${GITHUB_REF_NAME//\//-}-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-test-reports, path: "**/build/reports/tests/**", if-no-files-found: ignore }

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      # Discord Rich Presence application id (Settings → Secrets → DISCORD_APP_ID). Optional.
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm ffmpeg
      - name: Test
        # The UI render and audio tests need a desktop-like environment; Linux has it headless.
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon :desktop:test
      - name: Package
        run: ./gradlew --no-daemon :desktop:packageDistributionForCurrentOS
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/build/compose/binaries -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: desktop-${{ matrix.name }}, path: out/*, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with: { name: desktop-screenshots, path: desktop/build/desktop-*.png, if-no-files-found: ignore }

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "{android,desktop-Windows,desktop-Linux,desktop-macOS}", merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
